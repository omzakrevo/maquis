# Compile la version Windows de CAISSE PRO sur une machine Windows de GitHub.
# Déclenchement : bouton « Run workflow » (onglet Actions) ou publication d'un tag v*.
# Résultat : un ZIP portable + un installateur .exe (onglet Actions > Artifacts,
# et page Releases quand le déclenchement vient d'un tag).
name: Windows

on:
  workflow_dispatch:
  push:
    branches: ['caisse-pro']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests
        continue-on-error: true # un test qui échoue ne bloque pas la fabrication du .exe
        # les tests « petit écran » utilisent des polices Linux : exclus sur Windows
        run: flutter test --exclude-tags petit-ecran

      - name: Compilation Windows
        run: flutter build windows --release

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: ZIP portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\CaissePro_V${{ steps.v.outputs.version }}_Windows_portable.zip"

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" windows\installer\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CaissePro-Windows-${{ steps.v.outputs.version }}
          path: flutter_app/dist/*

      # Publication téléchargeable sans compte GitHub (page Releases du dépôt).
      - name: Publication
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: CAISSE PRO ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: flutter_app/dist/*
