name: maquis_resto_pro
publish_to: none
description: Caisse locale MAQUIS & RESTO PRO (V0.5, poste unique)
version: 0.9.0+5012
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  uuid: ^4.5.1
  crypto: ^3.0.7
  sqflite_common: ^2.5.14
  path_provider: ^2.1.6
  print_bluetooth_thermal: ^1.2.5
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  qr: ^4.0.0
  excel: ^4.0.6
  file_picker: ^13.1.0
  archive: ^3.6.1
  xml: ^6.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_256.png
    - assets/brand/logo.png
    - assets/brand/logo_pharma_256.png
    - assets/brand/logo_pharma.png
    - assets/products/
    - assets/demo/pharma/
    - assets/demo/moto/

flutter_launcher_icons:
  android: true
  image_path: "assets/brand/icon_square.png"
  adaptive_icon_background: "assets/brand/icon_background.png"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/brand/logo.png"
    icon_size: 256
